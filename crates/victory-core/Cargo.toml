[package]
name = "victory-core"
description = "Shared plumbing: configuration, paths, the asset-policy guard, logging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tracing-chrome = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Frame traces: spans of target "profile" go to a trace file for Perfetto
# (see docs/profiling.md).
profile = ["dep:tracing-chrome", "dep:tracing"]
# Lets `VICTORY_LOG` enable debug and trace output.
diagnostics = []

[lints]
workspace = true
